name: Coverage Check

on:
  pull_request:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and enforce 85% coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: Write coverage result to step summary
        if: always()
        run: |
          echo "## Coverage Check" >> "$GITHUB_STEP_SUMMARY"
          echo "Required coverage: 85%" >> "$GITHUB_STEP_SUMMARY"
          echo "See the test and coverage logs above for the measured result." >> "$GITHUB_STEP_SUMMARY"